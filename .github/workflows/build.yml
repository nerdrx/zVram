name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install development packages
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev libzstd-dev libsdl2-dev glslc mesa-vulkan-drivers vulkan-validationlayers spirv-tools
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 2
      - name: Check launcher syntax
        run: python3 -m py_compile zvram dmem_probe.py check_primbench.py check_model.py check_vulkan_idle_model.py test_vulkan_ram_guard.py test_vulkan_compression_options.py test_vulkan_pipeline.py test_gdeflate_gpu_layer.py && ./zvram --help && python3 check_vulkan_idle_model.py --help
      - name: Check low-memory abort cleanup
        run: python3 test_vulkan_ram_guard.py
      - name: Check Vulkan compression options and CPU policy
        run: python3 test_vulkan_compression_options.py && ctest --test-dir build -R '^cpu-(compression-policy|resident-bootstrap)$' --output-on-failure
      - name: Check bounded model evidence
        run: python3 test_vulkan_model_budget.py
      - name: Check lossless parallel snapshot decoding
        run: ctest --test-dir build -R cpu-snapshot-decode --output-on-failure
      - name: Check GDeflate envelope bounds without GPU execution
        run: ctest --test-dir build -R cpu-gdeflate-envelope --output-on-failure
      - name: Compile standalone GDeflate research host without running it
        run: cmake -S . -B build/research -DZVRAM_BUILD_GDEFLATE_RESEARCH=ON -DCMAKE_BUILD_TYPE=Release && cmake --build build/research --target zvram-gdeflate-research -j 2
      - name: Validate research modules and run CPU-only Vulkan correctness fixtures
        run: |
          spirv-val --target-env vulkan1.2 research/gdeflate/GDeflate-bounded-wave32.spv
          spirv-val --target-env vulkan1.2 research/gdeflate/GDeflate-bounded-subgroup8.spv
          python3 research/gdeflate/test_software.py --binary build/research/zvram-gdeflate-research
      - name: Check bounded snapshot decode look-ahead
        run: ctest --test-dir build -R cpu-snapshot-pipeline --output-on-failure
      - name: Check offscreen graphics fixture on CPU Vulkan
        run: python3 test_graphics_software.py --binary build/zvram-vulkan-graphics-check
      - name: Build optional GDeflate codec and GPU decoder, run CPU checks
        run: |
          cmake -S . -B build/codecs -DZVRAM_ENABLE_GDEFLATE=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/codecs -j 2
          ctest --test-dir build/codecs -R '^cpu-' --output-on-failure
      # GPU integrity checks are run on the hardware documented in VALIDATION.md.
